<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        color: #000000;
    }

    .page {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;

    }

    h1 {

        line-height: 1.2;
        margin: 0;

    }

    header {
        background-color: #826c6c;
        padding: 20px;

        background-color: #7fffd4;
        padding: 10px;

    }

    .navigation {

        padding: 15px;

        margin: 0;

        margin: 0 10px;
    }

    .navigation a {
        color: #000000;
        text-decoration: underline;
    }

    .breakingPost {
        background-color: #d0d0dd;
        padding: 15px;
        text-align: center;
        font-weight: bold;
        display: block;
    }

    .content {
        width: 100%;
    }

    .article {
        padding: 20px;
        text-align: left;
    }

    img {
        max-width: 100%;
        height: auto;
        border: 0;
        display: block;
    }

    .helperContent {
        background-color: #f5c9c9;
        padding: 20px;
        display: block;
    }

    footer {
        background-color: #826c6c;
        padding: 20px;
        text-align: center;
    }

    footer .motto {
        background-color: #d2691e;
        padding: 10px;

</style>
